{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="login-wrapper">
    
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.jpeg') }}" 
             alt="Logo OM" 
             class="login-logo rounded-circle shadow-sm">
        <h3 class="mt-3 fw-bold text-theme-primary">Système de Gestion OM</h3>
        <p class="text-muted">Veuillez vous authentifier pour continuer</p>
    </div>

    <div class="card login-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
            <form action="/login" method="POST">
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Nom d'utilisateur </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">👤</span>
                        <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Ex: ADMIN01" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">🔒</span>
                        <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-theme w-100 py-2 mt-3 shadow-sm">Se connecter</button>
            </form>
        </div>
    </div>
    

</div>
{% endblock %}
